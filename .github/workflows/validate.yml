name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validators
        run: |
          pip install skills-ref
          npm install -g @anthropic-ai/claude-code
          gh --version

      - name: Validate (repo, Agent Skills spec, Claude Code, Copilot)
        run: npm run validate
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Package skills
        run: npm run package
